<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=2" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" />
    <meta
      name="description"
      content="五子棋网页版：本地双人、人机对战与蓝色大肥鱼提示。"
    />
    <title>五子棋 · 大肥鱼陪你下</title>
  </head>
  <body>
    <div id="app">
      <section id="home-screen" class="screen home">
        <div class="home-orbs" aria-hidden="true"></div>
        <header class="home-header">
          <div class="brand">
            <span class="brand-dot" aria-hidden="true"></span>
            <span>DaFeiYuGomo</span>
          </div>
          <div class="home-tools">
            <button id="home-bgm" class="ghost-btn" type="button" aria-pressed="true" title="背景音乐">
              音乐开
            </button>
            <button id="home-settings" class="ghost-btn" type="button">设置</button>
          </div>
        </header>

        <main class="home-main">
          <div class="home-mascot" id="home-mascot" aria-hidden="true"></div>
          <p class="eyebrow">15 × 15 · 五连即胜</p>
          <h1>五子棋<span>大肥鱼陪你下</span></h1>
          <p class="home-desc">
            人 vs 人、人 vs 机，还有会讲思路的提示。手机和电脑都能直接玩。
          </p>
          <div class="home-actions">
            <button id="start-pvp" class="btn btn-primary" type="button">
              <span>人 vs 人</span>
              <small>本地双人</small>
            </button>
            <button id="start-pvai" class="btn btn-secondary" type="button">
              <span>人 vs 机</span>
              <small>v2 + MCTS</small>
            </button>
            <button id="home-import" class="btn btn-ghost" type="button">
              <span>导入对局</span>
              <small>打开 JSONL 复盘</small>
            </button>
          </div>
          <p class="home-note">头像来自 DeepSeek 二创社区 · 如有侵权请联系删除</p>
        </main>

        <footer class="home-footer">
          <button id="home-about" class="text-btn" type="button">关于 / 署名</button>
          <span class="footer-sep" aria-hidden="true">·</span>
          <span class="footer-note">AI 难度可在设置中调整</span>
          <span class="footer-sep" aria-hidden="true">·</span>
          <span id="app-version" class="footer-note" title="版本">v—</span>
        </footer>
      </section>

      <section id="game-screen" class="screen game hidden" aria-label="对局">
        <header class="game-header">
          <button id="game-back" class="ghost-btn back-btn" type="button">返回</button>
          <div class="game-meta">
            <span id="game-mode" class="game-mode">人 vs 机</span>
            <span id="game-status" class="status-pill" role="status" aria-live="polite">
              黑方落子
            </span>
          </div>
          <div class="game-tools">
            <button id="game-bgm" class="ghost-btn" type="button" aria-pressed="true" title="背景音乐">
              音乐开
            </button>
            <button id="game-sound" class="ghost-btn" type="button" aria-pressed="true">
              音效开
            </button>
            <button id="game-settings" class="ghost-btn" type="button">设置</button>
          </div>
        </header>

        <main class="game-body">
          <div class="board-wrap" id="board-wrap">
            <div class="board-frame">
              <canvas
                id="board-canvas"
                tabindex="0"
                aria-label="五子棋棋盘，使用方向键移动，回车落子"
              ></canvas>
              <div
                id="board-loading"
                class="board-loading hidden"
                role="status"
                aria-live="polite"
              >
                <div class="board-loading-card">
                  <span class="spinner" aria-hidden="true"></span>
                  <span>AI 正在加载…</span>
                </div>
              </div>
            </div>
          </div>

          <aside class="side-panel">
            <div class="mascot-card">
              <div class="mascot-avatar" id="mascot-avatar" aria-hidden="true"></div>
              <div class="bubble">
                <div class="bubble-head">
                  <span class="bubble-name">蓝色大肥鱼</span>
                </div>
                <p id="hint-text">点「提示」，我帮你看看这步该怎么走。</p>
                <div id="hint-chips" class="hint-chips"></div>
              </div>
            </div>

            <div class="game-actions">
              <button id="btn-hint" class="btn btn-primary" type="button">提示</button>
              <button id="btn-undo" class="btn btn-ghost" type="button">悔棋</button>
              <button id="btn-restart" class="btn btn-ghost" type="button">重开</button>
            </div>
            <p class="side-note">
              提示由大肥鱼搜索后给出建议；评分为搜索评分，不是真实胜率。AI 难度可在设置中调整。
            </p>
          </aside>
        </main>
      </section>

      <section id="review-screen" class="screen review hidden" aria-label="复盘">
        <header class="game-header">
          <button id="review-back" class="ghost-btn back-btn" type="button">返回对局</button>
          <div class="game-meta">
            <span id="review-title" class="game-mode">复盘</span>
            <span id="review-status" class="status-pill">未评估</span>
          </div>
          <div class="game-tools">
            <button id="review-export" class="ghost-btn" type="button">导出 JSONL</button>
          </div>
        </header>

        <main class="review-body">
          <div class="board-wrap" id="review-board-wrap">
            <div class="board-frame">
              <canvas id="review-canvas" aria-label="复盘棋盘，只读"></canvas>
            </div>
          </div>

          <aside class="review-panel">
            <div id="review-summary" class="review-summary"></div>
            <div class="review-side-toggle" id="review-side-toggle" role="group" aria-label="曲线视角">
              <button class="difficulty-btn" data-side="human" aria-pressed="true" type="button">你的视角</button>
              <button class="difficulty-btn" data-side="rival" aria-pressed="false" type="button">对手视角</button>
            </div>
            <div class="review-chart-wrap" id="review-chart-wrap">
              <canvas id="review-chart" aria-label="估值曲线"></canvas>
              <div id="review-tooltip" class="review-tooltip hidden"></div>
            </div>
            <div
              id="review-progress"
              class="review-progress hidden"
              role="progressbar"
              aria-label="评估进度"
            >
              <i id="review-progress-bar"></i>
            </div>
            <div class="review-controls">
              <button id="review-first" class="ghost-btn" type="button" aria-label="回到开头">首</button>
              <button id="review-prev" class="ghost-btn" type="button" aria-label="上一手">←</button>
              <button id="review-play" class="ghost-btn" type="button">播放</button>
              <button id="review-next" class="ghost-btn" type="button" aria-label="下一手">→</button>
              <button id="review-last" class="ghost-btn" type="button" aria-label="跳到结尾">尾</button>
              <button id="review-speed" class="ghost-btn" type="button" aria-label="播放速度">1x</button>
            </div>
            <div id="review-detail" class="review-detail">开局</div>
            <ol id="review-list" class="review-list"></ol>
            <div class="review-actions">
              <button id="review-fast" class="btn btn-secondary" type="button">简易评估</button>
              <button id="review-deep" class="btn btn-primary" type="button">深度评估</button>
              <button id="review-stop" class="btn btn-ghost hidden" type="button">停止</button>
            </div>
            <p class="side-note">
              估值为搜索评分，不是真实胜率；评级只反映估值损失，简易评估不评级。空格播放 / 暂停，← → 步进。
            </p>
          </aside>
        </main>
      </section>

      <input
        id="import-file"
        type="file"
        accept=".jsonl,application/x-ndjson,application/json,text/plain"
        hidden
      />

      <div id="modal-root"></div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
